name: Build Open Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          elif command -v sdkmanager &>/dev/null; then
            echo "Using sdkmanager from PATH"
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app-debug.apk was not found in app/build/outputs/apk/debug/"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "APK generated successfully:"
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Report Build Failure
        if: failure()
        run: |
          echo "::error::Open Jarvis debug APK build failed. Please inspect the Gradle step logs above for details."
